name: build and release imgtopixel

on:
  workflow_dispatch: # boton para ejecutar en "Actions" 
  schedule:
    - cron: '0 0 * * 6' # alrededor de cada sabado a las 00:00 UTC

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps: #clonar el repo actual
      - name: clonar el repo
        uses: actions/checkout@v4
        with: 
          path: origen

      - name: catcheer clone
        uses: actions/checkout@v4
        with:
          repository: nzxy-dev/Catcheer
          path: catcheer

      - name: install dependencias de linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: copiar origen (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd catcheer
          rm -rf build
          mkdir -p build/source
          cp -r ../origen/* build/source/

      - name: build linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd catcheer
          chmod +x build.sh
          ./build.sh
          cp ../origen/icon.png build/
          rm -rf build/CMakeFiles build/CMakeCache.txt build/cmake_install.cmake build/Makefile
          # rear zip
          cd build && zip -r ../img-to-pixel-linux.zip * && cd ..

      - name: copiar origen (windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cd catcheer
          if exist build rmdir /s /q build
          mkdir build\s-folder
          xcopy /s /e /y ..\origen\* build\s-folder\

      - name: build windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cd catcheer
          call build_catcheer.bat

          copy /y ..\origen\icon.ico build\

          rmdir /s /q build\CMakeFiles
          del /f /q build\CMakeCache.txt
          del /f /q build\cmake_install.cmake
          del /f /q build\Makefile


      - name: generar nombre de version (tag)
        id: date_version
        run: echo "VERSION=build-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
        shell: bash


      - name: comprimir en powershell
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path catcheer/build/* -DestinationPath catcheer/img-to-pixel-windows.zip

      - name: upload a github releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Img-To-Px-Auto_release_with_catcheer - ${{ env.VERSION }}"
          body: "compilacion auto completada"
          files: |
            catcheer/*.zip

